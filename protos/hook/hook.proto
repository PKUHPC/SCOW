syntax = "proto3";

package scow.server.hook;

import "common/money.proto";
import "common/ended_job.proto";
import "google/protobuf/timestamp.proto";

message AccountBlocked {
  string account_name = 1;
  string tenant_name = 2;
}

message AccountUnblocked {
  string account_name = 1;
  string tenant_name = 2;
}

message AccountCreated {
  string account_name = 1;
  string tenant_name = 2;
  string owner_id = 3;
  optional string comment = 4;
}

message AccountDeleted {
  string account_name = 1;
  string tenant_name = 2;
  optional string owner_id = 3;
  optional string comment = 4;
}

message UserBlockedInAccount {
  string user_id = 1;
  string account_name = 2;
}

message UserUnblockedInAccount {
  string user_id = 1;
  string account_name = 2;
}

message UserCreated {
  string user_id = 1;
  string tenant_name = 2;
}

message UserAdded {
  string user_id = 1;
  string tenant_name = 2;
}

message UserDeleted {
  string user_id = 1;
  string tenant_name = 2;
}

message AccountPaid {
  string account_name = 1;
  common.Money amount = 2;
  string type = 3;
  string comment = 4;
}

message TenantPaid {
  string tenant_name = 1;
  common.Money amount = 2;
  string type = 3;
  string comment = 4;
}

message JobsSaved {
  repeated common.JobInfo jobs = 1;
}

message AccountAssignedToClusters {
  string account_name = 1;
  string tenant_name = 2;
  repeated string cluster_ids = 3;
}

message AccountUnassignedFromCluster {
  string account_name = 1;
  string tenant_name = 2;
  string cluster_id = 3;
}

message OnEventRequest {
  message Metadata {
    google.protobuf.Timestamp time = 1;
  }

  Metadata metadata = 1;

  oneof event {
    AccountBlocked account_blocked = 2;
    AccountUnblocked account_unblocked = 3;
    AccountCreated account_created = 4;
    UserBlockedInAccount user_blocked_in_account = 5;
    UserUnblockedInAccount user_unblocked_in_account = 6;
    UserCreated user_created = 7;
    UserAdded user_added = 8;
    AccountPaid account_paid = 9;
    TenantPaid tenant_paid = 10;
    JobsSaved jobs_saved = 11;
    AccountAssignedToClusters account_assigned_to_clusters = 12;
    AccountUnassignedFromCluster account_unassigned_from_cluster = 13;
    AccountDeleted account_deleted = 14;
    UserDeleted user_deleted = 15;
  }
}
message OnEventResponse {

}

service HookService {
  rpc OnEvent (OnEventRequest) returns (OnEventResponse);
}
