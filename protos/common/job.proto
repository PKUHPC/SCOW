syntax = "proto3";

package scow.common;
import "google/protobuf/timestamp.proto";

import "common/money.proto";

message RunningJob {
  string job_id = 1;
  string partition = 2;
  string name = 3;
  string user = 4;
  string state = 5;
  string running_time = 6;
  string nodes = 7;
  string nodes_or_reason = 8;
  string account = 9;
  string cores = 10;
  string gpus = 11;
  string qos = 12;
  string submission_time = 13;

  /**
  days-hours:minutes:seconds.
  The value may be  "NOT_SET"  if not yet established or "UNLIMITED" for no
  limit.  (Valid for jobs and job steps)
   */
  string time_limit = 14;

  string working_dir = 15;

  int64 mem_req = 16;
  optional uint32 mem_alloc = 17;
  optional uint32 cpus_alloc = 18;
  optional uint32 nodes_alloc = 19;
  optional uint32 gpus_alloc = 20;
  optional string nodelist = 21;
  optional string reason = 22;
  optional string start_time = 23;
  optional string end_time = 24;

  common.Money account_price = 25;
  common.Money tenant_price = 26;
  optional ChargingPeriod charging_period = 27;
  message ChargingPeriod {
    google.protobuf.Timestamp start_time = 1;
    google.protobuf.Timestamp end_time = 2;
  }
}
