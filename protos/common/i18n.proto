syntax = "proto3";

package scow.common;

message I18nObject {
  message I18n {
    string default = 1;
    optional string en = 2;
    optional string zh_cn = 3;
    optional string ja = 4;
    optional string ko = 5;
    optional string fr = 6;
    optional string de = 7;
    optional string es = 8;
    optional string pt = 9;
    optional string ru = 10;
  }
  I18n i18n = 1;
}

message I18nStringProtoType {
  oneof value {
    string direct_string = 1;
    I18nObject i18n_object = 2;
  }
}
