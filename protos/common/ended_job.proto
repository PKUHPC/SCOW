syntax = "proto3";

package scow.common;

import "common/money.proto";
import "google/protobuf/timestamp.proto";

message JobInfo {
  uint64 bi_job_index = 1;
  uint32 id_job = 2;
  string account = 3;
  string user = 4;
  string partition = 5;
  string nodelist = 6;
  string job_name = 7;
  string cluster = 8;
  google.protobuf.Timestamp time_submit = 9;
  optional google.protobuf.Timestamp time_start = 10;
  google.protobuf.Timestamp time_end = 11;
  int32 gpu = 12;
  uint32 cpus_req = 13;
  uint32 mem_req = 14;
  uint32 nodes_req = 15;
  uint32 cpus_alloc = 16;
  uint32 mem_alloc = 17;
  uint32 nodes_alloc = 18;
  uint32 timelimit = 19;
  uint64 time_used = 20;
  uint64 time_wait = 21;
  string qos = 22;
  google.protobuf.Timestamp record_time = 23;
  common.Money account_price = 24;
  common.Money tenant_price = 25;
  optional string user_name = 26;
  optional string account_owner_id = 27;
  optional string account_owner_name = 28;
}
