syntax = "proto3";

package scow.portal;

import "google/protobuf/timestamp.proto";
import "common/i18n.proto";

// 为确保兼容性保留原有声明，作为同名别名
// 其他proto引用时请使用 common/i18n.proto/I18nStringProtoType
message I18nStringProtoType {
  oneof value {
    string direct_string = 1;
    common.I18nObject i18n_object = 2;
  }
}

message ConnectToAppRequest {
  string user_id = 1;
  string cluster = 2;
  string session_id = 3;
  uint32 job_id = 4;
}

message WebAppProps {
  string method = 1;
  string path = 2;
  map<string, string> query = 3;
  map<string, string> form_data = 4;
  enum ProxyType {
    RELATIVE = 0;
    ABSOLUTE = 1;
  }
  ProxyType proxy_type = 5;
  map<string, string> custom_form_data = 6;
}

message ShadowDeskAppProps {
  string method = 1;
  string path = 2;
  map<string, string> query = 3;
  map<string, string> form_data = 4;
  map<string, string> custom_form_data = 5;
}

message VncAppProps {}

// NOT_FOUND: session id not found
// UNAVAILABLE: the session cannot be connected
message ConnectToAppResponse {
  string host = 1;
  uint32 port = 2;
  optional string password = 3;
  oneof app_props {
    WebAppProps web = 4;
    VncAppProps vnc = 5;
    ShadowDeskAppProps shadow_desk = 6;
  }
}

message CreateAppSessionRequest {
  string user_id = 1;
  string cluster = 2;
  string app_id = 3;
  string account = 4;
  optional string partition = 5;
  optional string qos = 6;
  uint32 core_count = 7;
  uint32 max_time = 8;
  // the base path before /${proxyType}/{compute node ip}/{port}
  // for SCOW, this is ${BASE_PATH}/api/proxy
  string proxy_base_path = 9;
  map<string, string> custom_attributes = 10;
  uint32 node_count  = 11;
  optional uint32 gpu_count = 12;
  optional string memory = 13;
  string app_job_name = 14;
}

// NOT_FOUND: app is not found
// INTERNAL: SBATCH failed, details has output
// INVALID_ARGUMENT: the custom form atrributes is invalid
message CreateAppSessionResponse {
  uint32 job_id = 1;
  string session_id = 2;
}

message ListAppSessionsRequest {
  string user_id = 1;
  string cluster = 2;
}

message AppSession {
  string session_id = 1;
  uint32 job_id = 2;
  google.protobuf.Timestamp submit_time = 3;
  string app_id = 4;
  // Undefined: apps[app.id]？.name is not found
  optional string app_name = 5;
  string state = 6;
  string data_path = 7;
  string running_time = 8;
  string time_limit = 9;
  optional string reason = 10;

  optional string host = 11;
  optional uint32 port = 12;

  optional string user = 13;
  optional string proxy_server = 14;

  // app type: the value may be "web", "vnc" and "shadowDesk"
  optional string app_type = 15;
  string job_name = 16;
  optional string connect_path = 17;
}

message ListAppSessionsResponse {
  repeated AppSession sessions = 1;
}

message GetAppMetadataRequest {
  string app_id = 1;
  string cluster = 2;
}

message SelectOption {
  string value = 1;
  I18nStringProtoType label = 2;
  optional bool require_gpu = 3;
}

message FixedValue {
  oneof value {
    string text = 1;
    uint32 number = 2;
  }
  optional bool hidden = 3;
}

message CommandSelect {
  string script = 1;
}

message AppCustomAttribute {
  enum AttributeType {
    NUMBER = 0;
    TEXT = 1;
    SELECT = 2;
    FILE = 3;
    COMMAND_SELECT = 4;
  }
  AttributeType type = 1;
  I18nStringProtoType label = 2;
  string name = 3;
  repeated SelectOption options = 4;
  bool required =5;
  oneof default_input {
    string text = 6;
    uint32 number = 7;
  }
  optional I18nStringProtoType placeholder = 8;
  optional FixedValue fixed_value = 9;
  optional CommandSelect command_select = 10;
}

message GetAppMetadataResponse {
  enum ReservedAppAttributeName {
    UNKNOWN = 0;
    APP_JOB_NAME = 1;
    ACCOUNT = 2;
    PARTITION = 3;
    QOS = 4;
    NODE_COUNT = 5;
    CORE_COUNT = 6;
    GPU_COUNT = 7;
    MAX_TIME = 8;
  }

  enum ReservedConfigType {
    UNKNOWN_TYPE = 0;
    FIXED_VALUE = 1;
    SELECT = 2;
    COMMAND_SELECT = 3;
  }

  message SelectConfig {
    message SelectOption {
      oneof value {
        string text = 1;
        uint32 number =2;
      }
      optional I18nStringProtoType label = 3;
      optional bool require_gpu = 4;
    }
    ReservedConfigType type = 1;
    oneof default_input {
      string text = 2;
      uint32 number = 3;
    }
    repeated SelectOption options = 4;
  }

  message FixedValueConfig {
    ReservedConfigType type = 1;
    FixedValue fixed_value = 2;
  }

  message CommandSelectConfig {
    ReservedConfigType type = 1;
    string script = 2;
  }

  message ReservedAppAttribute {
    ReservedAppAttributeName name = 1;
    oneof config {
      FixedValueConfig fixed_value_config = 2;
      SelectConfig select_config = 3;
      CommandSelectConfig command_select_config = 4;
    };
  }

  string app_name = 1;
  repeated AppCustomAttribute attributes = 2;
  optional I18nStringProtoType app_comment = 3;
  repeated ReservedAppAttribute reserved_app_attributes = 4;
}

message ListAvailableAppsRequest {
  string cluster = 1;
  // 当开启授权应用功能后，过滤用户关联账户的可用应用
  optional string user_id = 2;
}

message App {
  string id = 1;
  string name = 2;
  optional string logo_path = 3;
}

message ListAvailableAppsResponse {
  repeated App apps = 1;
}

message SubmissionInfo {
  string user_id = 1;
  string cluster = 2;
  string app_id = 3;
  string app_name =4;
  string account = 5;
  optional string partition = 6;
  optional string qos = 7;
  uint32 core_count = 8;
  uint32 max_time = 9;
  google.protobuf.Timestamp submit_time = 10;
  map<string, string> custom_attributes = 11;
  uint32 node_count = 12;
  optional uint32 gpu_count = 13;
}

message GetAppLastSubmissionRequest {
  string user_id = 1;
  string cluster = 2;
  string app_id = 3;
}

message GetAppLastSubmissionResponse {
  optional SubmissionInfo last_submission_info = 1;
}

message RunScriptRequest {
  string user_id = 1;
  string cluster = 2;
  string script = 3;
  // 命令运行超时时间
  uint32 timeout_seconds = 4;
}

message RunScriptResponse {
  string output = 1;
}


service AppService {
  rpc ConnectToApp(ConnectToAppRequest) returns (ConnectToAppResponse);

  rpc CreateAppSession(CreateAppSessionRequest) returns (CreateAppSessionResponse);

  rpc ListAppSessions(ListAppSessionsRequest) returns (ListAppSessionsResponse);

  rpc GetAppMetadata(GetAppMetadataRequest) returns (GetAppMetadataResponse);

  rpc ListAvailableApps(ListAvailableAppsRequest) returns (ListAvailableAppsResponse);

  rpc GetAppLastSubmission(GetAppLastSubmissionRequest) returns (GetAppLastSubmissionResponse);

  rpc RunScript(RunScriptRequest) returns (RunScriptResponse);
}
