syntax = "proto3";

package scow.portal;

message PageLinkEntry {
  string path = 1;
  // antd的图标ID
  string icon = 2;
}

message ClusterPageLinkEntry {
  string cluster_id = 1;
  string path = 2;
  // antd的图标ID
  string icon = 3;
}

message ShellEntry {
  string cluster_id = 1;
  string login_node = 2;
  // antd的图标ID
  string icon = 3;
}

message AppEntry {
  string app_id = 1;
  string cluster_id = 2;
  // 应用图标的路径
  // 只在getQuickEntriesResponse中使用，获取查询时config下配置的应用图标路径
  // 前端会根据这个路径加载应用图标
  optional string app_logo_path = 3;
}

message Entry {
  string id = 1;
  string name = 2;

  oneof entry {
    PageLinkEntry page_link = 3;
    ShellEntry shell = 4;
    AppEntry app = 5;
    ClusterPageLinkEntry cluster_page_link = 6;
  }
}
message GetQuickEntriesRequest {
  string user_id = 1;
}

message GetQuickEntriesResponse {
  repeated Entry quick_entries = 1;
}

message SaveQuickEntriesRequest {
  string user_id = 1;
  repeated Entry quick_entries = 2;
}

message SaveQuickEntriesResponse {
}

service DashboardService {
  rpc GetQuickEntries(GetQuickEntriesRequest) returns (GetQuickEntriesResponse);
  rpc SaveQuickEntries(SaveQuickEntriesRequest) returns (SaveQuickEntriesResponse);
}
