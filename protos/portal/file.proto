syntax = "proto3";

package scow.portal;

enum FileType {
  FILE = 0;
  DIR = 1;
  // 软链接（符号链接）
  SYMLINK = 2;
}

message CopyRequest {
  string user_id = 1;
  string cluster = 2;
  string from_path = 3;
  string to_path = 4;
}

// NOT_FOUND: cluster is not found
// INTERNAL: cp command failed. details has stderr
message CopyResponse {
}

message CreateFileRequest {
  string user_id = 1;
  string cluster = 2;
  string path = 3;
}

// NOT_FOUND: cluster is not found
// ALREADY_EXISTS: file also exists
message CreateFileResponse {
}

message DeleteDirectoryRequest {
  string user_id = 1;
  string cluster = 2;
  string path = 3;
}

// NOT_FOUND: cluster is not found
message DeleteDirectoryResponse {
}

message DeleteFileRequest {
  string user_id = 1;
  string cluster = 2;
  string path = 3;
}

// NOT_FOUND: cluster is not found
message DeleteFileResponse {
}

message DownloadRequest {
  string user_id = 1;
  string cluster = 2;
  string path = 3;
}

message DownloadResponse {
  bytes chunk = 1;
}

message CompressAndDownloadRequest {
  string user_id = 1;
  string cluster = 2;
  repeated string paths = 3; // 需要压缩的文件或目录路径
}

message CompressAndDownloadResponse {
  bytes chunk = 1;
}

message GetHomeDirectoryRequest {
  string user_id = 1;
  string cluster = 2;
}

// NOT_FOUND: cluster is not found
message GetHomeDirectoryResponse {
  string path = 1;
}

message ReadDirectoryRequest {
  string user_id = 1;
  string cluster = 2;
  string path = 3;
  // update_access_time 用于指示是否需要更新目录下全部文件的访问时间戳，主要在 SCOW 文件传输功能中使用
  // 为 true 时表示需要更新文件的访问时间戳，从而确保文件的访问时间与传输时间同步
  // 为 false 时表示不需要更新文件的访问时间戳
  optional bool update_access_time = 4;
}

message FileInfo {
  string name = 1;
  FileType type = 2;
  string mtime = 3;
  uint32 mode = 4;
  uint64 size = 5;
  // 当 type 为 SYMLINK 时，返回软链接解析后的目标路径（绝对路径）
  optional string link_target_path = 6;
  // 当 type 为 SYMLINK 时，返回软链接解析后的目标类型（FILE/ DIR / SYMLINK）。
  // 若无法解析或目标不存在，则该字段为空。
  optional FileType link_target_type = 7;
}

// PERMISSION_DENIED: directory is not accessible
// INVALID_ARGUMENT: path is not directory or not exists
message ReadDirectoryResponse {
  repeated FileInfo results = 1;
}

message MoveRequest {
  string user_id = 1;
  string cluster = 2;
  string from_path = 3;
  string to_path = 4;
}

// INTERNAL: rename failed. details has error
message MoveResponse {
}

message MakeDirectoryRequest {
  string user_id = 1;
  string cluster = 2;
  string path = 3;
}

// NOT_FOUND: cluster not found
// ALREADY_EXISTS: directory already found
message MakeDirectoryResponse {
}

message CompressFilesRequest {
  string user_id = 1;
  string cluster = 2;
  // 需压缩的文件路径
  repeated string paths = 3;
  // 目标压缩文件路径
  string archive_path = 4;
}

message CompressFilesResponse {}

message InitMultipartUploadRequest {
  string cluster = 1;
  string user_id = 2;
  string path = 3;
  string name = 4;
  uint64 file_size_byte = 5;
  uint64 modification_time = 6;
}

message InitMultipartUploadResponse {
  uint64 chunk_size_byte = 1;
  uint64 file_size_byte = 2;
  uint64 modification_time = 3;
  repeated uint64 uploaded_indices = 4;
}

message UploadRequest {

  message Info {
    string user_id = 1;
    string cluster = 2;
    string path = 3;
    // 不传 chunk_idx 表示并非分片上传的请求，是普通的文件上传
    optional uint64 chunk_idx = 4;
  }

  oneof message {
    // only the first message has info
    Info info = 1;
    bytes chunk = 2;
  };
}

message UploadResponse {
  uint64 written_bytes = 1;
}

message CompleteMultipartUploadRequest {
  string user_id = 1;
  string cluster = 2;
  string path = 3;
  string name = 4;
}

message CompleteMultipartUploadResponse {
}

message GetFileMetadataRequest {
  string user_id = 1;
  string cluster = 2;
  string path = 3;
}

message GetFileMetadataResponse {
  uint64 size = 1;
  string type = 2;
  bool is_symlink = 3;
  // 当 is_symlink 为 true 时，返回软链接解析后的目标路径（绝对路径）
  optional string link_target_path = 4;
  // 当 is_symlink 为 true 时，返回软链接解析后的目标类型（FILE/ DIR / SYMLINK）。
  // 若无法解析或目标不存在，则该字段为空。
  optional FileType link_target_type = 5;
}

message ExistsRequest {
  string user_id = 1;
  string cluster = 2;
  string path = 3;
}

message ExistsResponse {
  bool exists = 1;
}

message StartFileTransferRequest {
  string from_cluster = 1;
  string to_cluster = 2;
  string user_id = 3;
  string from_path = 4;
  string to_path = 5;
}

message StartFileTransferResponse {

}

message QueryFileTransferRequest {
  string cluster = 1;
  string user_id = 2;
}

message TransferInfo {
  string to_cluster = 1;
  string file_path = 2;
  uint64 transfer_size_kb = 3; // 单位为KB，B：Byte
  uint32 progress = 4;
  float speed_k_bps = 5;
  uint64 remaining_time_seconds = 6;
}

message QueryFileTransferResponse {
  repeated TransferInfo transfer_infos = 1;
}

message TerminateFileTransferRequest {
  string from_cluster = 1;
  string to_cluster = 2;
  string user_id = 3;
  string from_path = 4;
}

message TerminateFileTransferResponse {

}

message DecompressFileRequest {
  string user_id = 1;
  string cluster_id = 2;
  string file_path = 3;
  string decompression_path = 4;
}

message DecompressFileResponse {

}

service FileService {
  rpc Copy(CopyRequest) returns (CopyResponse);
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc DeleteDirectory(DeleteDirectoryRequest) returns (DeleteDirectoryResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc Download(DownloadRequest) returns (stream DownloadResponse);
  rpc CompressAndDownload (CompressAndDownloadRequest) returns (stream CompressAndDownloadResponse);
  rpc GetHomeDirectory(GetHomeDirectoryRequest)
      returns (GetHomeDirectoryResponse);
  rpc ReadDirectory(ReadDirectoryRequest) returns (ReadDirectoryResponse);

  rpc Move(MoveRequest) returns (MoveResponse);

  rpc MakeDirectory(MakeDirectoryRequest) returns (MakeDirectoryResponse);

  rpc DecompressFile(DecompressFileRequest) returns (DecompressFileResponse);

  rpc CompressFiles(CompressFilesRequest) returns (CompressFilesResponse);
  /**
  * InitMultipartUpload 用于初始化文件分片上传。配置开启 scowd 才可使用
  * 获取文件分片临时存储目录、文件分片的大小和已上传的分片
  */
  rpc InitMultipartUpload(InitMultipartUploadRequest) returns (InitMultipartUploadResponse);
  rpc Upload(stream UploadRequest) returns (UploadResponse);
  /**
  * CompleteMultipartUpload 用于在文件全部分片上传完成后，告知服务端清理临时文件，得到最终文件。
  * 配置开启 scowd 才可使用
  */
  rpc CompleteMultipartUpload(CompleteMultipartUploadRequest) returns (CompleteMultipartUploadResponse);


  rpc GetFileMetadata(GetFileMetadataRequest) returns (GetFileMetadataResponse);

  rpc Exists(ExistsRequest) returns (ExistsResponse);

  rpc StartFileTransfer(StartFileTransferRequest) returns (StartFileTransferResponse);

  rpc QueryFileTransfer(QueryFileTransferRequest) returns (QueryFileTransferResponse);

  rpc TerminateFileTransfer(TerminateFileTransferRequest) returns (TerminateFileTransferResponse);
}
