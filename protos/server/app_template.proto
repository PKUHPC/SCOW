syntax = "proto3";

package scow.server;

import "google/protobuf/timestamp.proto";
import "server/job_template.proto";

message AppTemplateDetail {
  uint32 id              = 1;
  string template_name   = 2;
  string cluster         = 3;
  string account         = 4;
  string partition       = 5;
  string qos             = 6;
  uint32 node_count      = 7;
  uint32 core_count      = 8;
  uint32 gpu_count       = 9;
  uint32 max_time        = 10;
  MaxTimeUnit max_time_unit        = 11;
  optional uint32 memory_mb        = 12;
  string app_id                    = 14;
  optional string custom_attributes = 15; // JSON 字符串
  google.protobuf.Timestamp created_at = 16;
}

// ----- SaveAppTemplate -----
message SaveAppTemplateRequest {
  string user_id         = 1;
  string cluster         = 3;
  string template_name   = 4;
  string account         = 5;
  string partition       = 6;
  string qos             = 7;
  uint32 node_count      = 8;
  uint32 core_count      = 9;
  uint32 gpu_count       = 10;
  uint32 max_time        = 11;
  MaxTimeUnit max_time_unit       = 12;
  optional uint32 memory_mb       = 13;
  string app_id                   = 15;
  optional string custom_attributes = 16; // JSON 字符串
}

message SaveAppTemplateResponse {
  uint32 id = 1;
}

// ----- ListAppTemplates -----
message ListAppTemplatesRequest {
  string user_id    = 1;
  string app_id     = 2;
  string cluster    = 3;
}

message ListAppTemplatesResponse {
  repeated AppTemplateDetail templates = 1;
}

// ----- DeleteAppTemplate -----
message DeleteAppTemplateRequest {
  string user_id  = 1;
  uint32 id       = 2;
}

message DeleteAppTemplateResponse {}

// ----- RenameAppTemplate -----
message RenameAppTemplateRequest {
  string user_id       = 1;
  uint32 id            = 2;
  string new_name      = 3;
}

message RenameAppTemplateResponse {}

service AppTemplateService {
  rpc SaveAppTemplate(SaveAppTemplateRequest) returns (SaveAppTemplateResponse);
  rpc ListAppTemplates(ListAppTemplatesRequest) returns (ListAppTemplatesResponse);
  rpc DeleteAppTemplate(DeleteAppTemplateRequest) returns (DeleteAppTemplateResponse);
  rpc RenameAppTemplate(RenameAppTemplateRequest) returns (RenameAppTemplateResponse);
}
