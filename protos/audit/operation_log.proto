// 充值记录及消费记录请求target
message AccountOfTenantTarget {
  string account_name = 1;
  string tenant_name = 2;
}
message AccountsOfTenantTarget {
  string tenant_name = 1;
  repeated string account_names = 2;
}
message TenantTarget {
  string tenant_name = 1;
}
message AllTenantsTarget {
}
message AccountsOfAllTenantsTarget {
  repeated string account_names = 1;
}

message ExportPayRecord {
  oneof target {
    // 返回这个租户（tenantName）下这个账户（accountName）的充值记录
    AccountOfTenantTarget account_of_tenant = 1;
    // 返回这个租户（tenantName）下多个账户的充值记录
    AccountsOfTenantTarget accounts_of_tenant = 2;
    // 返回这个租户（tenantName）的充值记录
    TenantTarget tenant = 3;
    // 返回所有租户充值记录
    AllTenantsTarget all_tenants = 4;
  }
}

message ExportChargeRecord {
  oneof target {
    // 返回这个租户（tenantName）下这个账户（accountName）的消费记录
    AccountOfTenantTarget account_of_tenant = 4;
    // 返回这个租户（tenantName）下多个账户的消费记录
    AccountsOfTenantTarget accounts_of_tenant = 5;
    // 返回所有租户下多个账户的消费记录
    AccountsOfAllTenantsTarget accounts_of_all_tenants = 6;
    // 返回这个租户（tenantName）的租户消费记录
    TenantTarget tenant = 7;
    // 返回所有租户的租户消费记录
    AllTenantsTarget all_tenants = 8;
  }
}

// 充值记录及消费记录请求target
message JobsOfAccountTarget {
  string account_name = 1;
  string tenant_name = 2;
}
message JobsOfAccountAndUserTarget {
  string account_name = 1;
  string user_id = 2;
  string tenant_name = 3;
}
message JobsOfUserTarget {
  string user_id = 1;
  string tenant_name = 2;
}
message JobsOfTenantTarget {
  string tenant_name = 1;
}
message JobsOfJobIdTarget {
  uint32 job_id = 1;
  string tenant_name = 2;
}
message JobsOfJobIdsTarget {
  repeated uint64 job_ids = 1;
  string tenant_name = 2;
}
message JobsOfJobIdAndUserTarget {
  uint64 job_id = 1;
  string tenant_name = 2;
  string user_id = 3;
}

message JobsOfJobIdAndAccountTarget {
  uint64 job_id = 1;
  string tenant_name = 2;
  string account_name = 3;
}

message ExportJobRecord {
  oneof target {
    // 导出租户内某账户执行过的作业列表
    JobsOfAccountTarget jobs_of_account = 1;
    // 返回这个租户下某用户在某账户执行过的作业列表
    JobsOfAccountAndUserTarget jobs_of_account_and_user = 2;
    // 导出租户内某用户执行过的作业列表
    JobsOfUserTarget jobs_of_user = 3;
    // 导出租户内执行过的作业列表
    JobsOfTenantTarget jobs_of_tenant = 4;
    // 导出租户内执行过的特定ID的作业列表
    JobsOfJobIdTarget jobs_of_job_id = 5;
    // 导出租户内某用户执行过的特定ID的作业列表
    JobsOfJobIdAndUserTarget jobs_of_job_id_and_user = 6;
     // 导出租户内某账户执行过的特定ID的作业列表
    JobsOfJobIdAndAccountTarget jobs_of_job_id_and_account = 7;
     // 导出租户内执行过的多个ID的作业列表
    JobsOfJobIdsTarget jobs_of_job_ids = 8;
  }
}

