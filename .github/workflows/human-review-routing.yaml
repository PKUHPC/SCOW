name: Human Review Routing

on:
  pull_request_target:
    types: [ready_for_review, reopened, synchronize, converted_to_draft, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: human-review-routing-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route-reviewers:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}
    steps:
      # 只使用默认分支中的可信路由代码，不 checkout PR 分支。
      - name: Check out routing script from the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Route human reviewers
        uses: actions/github-script@v8
        with:
          script: |
            const routing = require("./.github/scripts/human-review-routing.cjs");
            const allowStart = routing.shouldAllowStart(context);
            await routing.routeHumanReviewers({ github, context, core, allowStart });
