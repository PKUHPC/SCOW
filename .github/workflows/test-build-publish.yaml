name: Test, Build and Publish Projects

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]
  push:
    tags:
      - "v**"
      - "ai-beta.**"
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  GOPROXY: https://goproxy.cn,direct

jobs:
  test-version-packages:
    name: Test and version packages
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}

    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'pull_request')

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          # changelog generation requires full history
          # to track each changelog file to its submission commit
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install packages
        run: |
          # Use PKU mirrors
          sudo sed -ri.bak -e 's/\/\/.*?(archive.ubuntu.com|mirrors.*?)\/ubuntu/\/\/mirrors.pku.edu.cn\/ubuntu/g' -e '/security.ubuntu.com\/ubuntu/d' /etc/apt/sources.list

          # Prepare sources for docker compose
          curl -fsSL https://mirrors.pku.edu.cn/docker-ce/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://mirrors.pku.edu.cn/docker-ce/linux/ubuntu \
            $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

          sudo apt update
          sudo apt install -y openssh-client docker-compose-plugin

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmmirror.com
          mirror: https://npmmirror.com/mirrors/node

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: |
          pnpm config set registry https://registry.npmmirror.com
          pnpm i --frozen-lockfile

      - name: Prepare dev libs and code
        run: pnpm prepareDev

      - name: Lint code
        run: pnpm lint

      - name: Generate SSH key pairs for test
        if: vars.RUN_TESTS == 'true'
        run: ssh-keygen -t rsa -f "$HOME/.ssh/id_rsa" -N ""

      - name: Log in to the ccrepo.pku.edu.cn
        uses: docker/login-action@v3.6.0
        with:
          registry: ccrepo.pku.edu.cn
          username: ${{ secrets.CCREPO_USERNAME }}
          password: ${{ secrets.CCREPO_PASSWORD }}

      - name: Start dev env for db testing
        if: vars.RUN_TESTS == 'true'
        run: |
          SSH_AUTHORIZED_PUBLIC_KEY="$(cat $HOME/.ssh/id_rsa.pub)" pnpm devenv --build

      - name: Check running containers
        if: vars.RUN_TESTS == 'true'
        run: docker ps

      - name: Wait for ports
        if: vars.RUN_TESTS == 'true'
        uses: ifaxity/wait-on-action@v1.2.1
        with:
          log: true
          verbose: true
          resource: "tcp:localhost:22222 tcp:localhost:3306 tcp:localhost:6379 tcp:localhost:389 tcp:localhost:6000 tcp:localhost:6001 tcp:localhost:6002"

      - name: Run tests
        if: vars.RUN_TESTS == 'true'
        run: |
          # Unset proxy for tests
          export https_proxy=""
          export http_proxy=""
          export HTTPS_PROXY=""
          export HTTP_PROXY=""

          pnpm test:ci

      - name: Upload test converage
        uses: codecov/codecov-action@v4
        if: vars.RUN_TESTS == 'true'
        with:
          files: ./libs/auth/coverage/lcov.info,./libs/ssh/coverage/lcov.info,./libs/libconfig/coverage/lcov.info,./libs/decimal/coverage/lcov.info,./libs/server/coverage/lcov.info,./apps/cli/coverage/lcov.info,./apps/auth/coverage/lcov.info,./apps/mis-server/coverage/lcov.info,./apps/portal-server/coverage/lcov.info,./apps/gateway/coverage/lcov.info,./apps/audit-server/coverage/lcov.info

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        if: vars.RUN_RELEASE == 'true' && github.ref == 'refs/heads/master'
        with:
          version: pnpm ci:version
        env:
          GITHUB_TOKEN: ${{ github.token }}

  scow-cli:
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}

    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'pull_request')

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmmirror.com
          mirror: https://npmmirror.com/mirrors/node

      - uses: pnpm/action-setup@v4

      - name: Install dependencies for scow-cli
        run: |
          pnpm config set registry https://registry.npmmirror.com
          pnpm i --frozen-lockfile --filter @scow/cli...

      - name: Build scow-cli
        run: pnpm build "--filter=@scow/cli"

      - name: Determine target directory
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            target="master"
            ref_type="branch"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            tag_name=${GITHUB_REF#refs/tags/}
            target="${tag_name}"
            ref_type="tag"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target="pr-${{ github.event.number }}"
            ref_type="pr"
          fi

          echo "target=${target}" >> $GITHUB_OUTPUT
          echo "ref_type=${ref_type}" >> $GITHUB_OUTPUT
          echo "Target directory: ${target}"

      - name: Upload CLI to ccrepo
        run: |
          target_url="https://ccrepo.pku.edu.cn/repository/scowbin/scow-cli/${{ steps.target.outputs.target }}"

          echo "Uploading CLI to target url: ${target_url}"

          for arch in x64 arm64; do
          curl -f --user "${{ secrets.CCREPO_USERNAME }}:${{ secrets.CCREPO_PASSWORD }}" \
            --upload-file "apps/cli/exe/cli-${arch}" \
            "${target_url}/scow-cli-${arch}"
          done

          echo "✅ Files uploaded successfully to ccrepo!"
          echo "📁 AMD64 Available at: ${target_url}/scow-cli-x64"
          echo "📁 ARM64 Available at: ${target_url}/scow-cli-arm64"

  build-images:
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'pull_request')

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: scow
            file: scow
            build_args: ""

          - name: docs
            file: docs
            build_args: BASE_PATH=/SCOW/

    steps:
      - uses: actions/checkout@v6
      - name: Log in to the ccrepo.pku.edu.cn
        uses: docker/login-action@v3.6.0
        with:
          registry: ccrepo.pku.edu.cn
          username: ${{ secrets.CCREPO_USERNAME }}
          password: ${{ secrets.CCREPO_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: ccrepo.pku.edu.cn/dockerhub/tonistiigi/binfmt:latest
          platforms: linux/amd64,linux/arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.http_proxy=${{ vars.HTTPS_PROXY }}
            env.https_proxy=${{ vars.HTTPS_PROXY }}
            image=ccrepo.pku.edu.cn/dockerhub/moby/buildkit:buildx-stable-1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ccrepo.pku.edu.cn/scow/${{ matrix.name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            HTTPS_PROXY=${{ vars.HTTPS_PROXY }}
            NO_PROXY=mirrors.pku.edu.cn
            ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          file: docker/Dockerfile.${{ matrix.file }}
          labels: ${{ steps.meta.outputs.labels }}
          # only build arm64 in tag commits or branches with name starting with `arm-`
          platforms: linux/amd64${{ (github.ref_type == 'tag' || startsWith(github.head_ref, 'arm-')) && ',linux/arm64' || '' }}

  build-adapters:
    name: Build Adapters
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'pull_request')

    permissions:
      contents: write
      packages: write

    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            image_suffix: ""
          - arch: arm64
            platform: linux/arm64
            image_suffix: "-arm64"

    steps:
      - uses: actions/checkout@v6

      - name: Determine target directory
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            target="master"
            ref_type="branch"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            tag_name=${GITHUB_REF#refs/tags/}
            target="${tag_name}"
            ref_type="tag"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target="pr-${{ github.event.number }}"
            ref_type="pr"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="master"
            ref_type="branch"
          fi

          echo "target=${target}" >> $GITHUB_OUTPUT
          echo "ref_type=${ref_type}" >> $GITHUB_OUTPUT
          echo "Target directory: ${target}"

      - name: Log in to the ccrepo.pku.edu.cn
        uses: docker/login-action@v3.6.0
        with:
          registry: ccrepo.pku.edu.cn
          username: ${{ secrets.CCREPO_USERNAME }}
          password: ${{ secrets.CCREPO_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: ccrepo.pku.edu.cn/dockerhub/tonistiigi/binfmt:latest
          platforms: linux/amd64,linux/arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: |
            env.http_proxy=${{ vars.HTTPS_PROXY }}
            env.https_proxy=${{ vars.HTTPS_PROXY }}
            image=ccrepo.pku.edu.cn/dockerhub/moby/buildkit:buildx-stable-1
          platforms: linux/amd64,linux/arm64

      - name: Build adapter binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          target: output
          build-args: |
            HTTPS_PROXY=${{ vars.HTTPS_PROXY }}
            TARGETARCH=${{ matrix.arch }}
            VERSION=${{ steps.target.outputs.target }}
          file: apps/scow-adapters/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=apps/scow-adapters/output/${{ matrix.arch }}
          tags: scow-adapters:${{ matrix.arch }}

      - name: Build and push ai adapter image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: |
            HTTPS_PROXY=${{ vars.HTTPS_PROXY }}
            TARGETARCH=${{ matrix.arch }}
            VERSION=${{ steps.target.outputs.target }}
          file: apps/scow-adapters/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: |
            ccrepo.pku.edu.cn/scow/scow-ai-adapter:${{ steps.target.outputs.target }}${{ matrix.image_suffix }}

      - name: Upload adapter binaries to ccrepo
        run: |
          for binary_name in scow-ai-adapter scow-crane-adapter scow-slurm-adapter; do
            target_url="https://ccrepo.pku.edu.cn/repository/scowbin/$binary_name/${{ steps.target.outputs.target }}/${{ matrix.arch }}/$binary_name"

            echo "Uploading to: $target_url"
            curl -f --user "${{ secrets.CCREPO_USERNAME }}:${{ secrets.CCREPO_PASSWORD }}" \
              --upload-file "apps/scow-adapters/output/${{ matrix.arch }}/app/build/bin/$binary_name" \
              "$target_url"
          done

          echo "✅ Uploaded adapter binaries to ccrepo successfully"

      - name: Prepare release artifacts
        if: steps.target.outputs.ref_type == 'tag'
        run: |
          mkdir -p apps/scow-adapters/release
          for binary_name in scow-ai-adapter scow-crane-adapter scow-slurm-adapter; do
            cp "apps/scow-adapters/output/${{ matrix.arch }}/app/build/bin/$binary_name" \
               "apps/scow-adapters/release/$binary_name-${{ matrix.arch }}"
          done

      - name: Upload adapter binary to GitHub release
        if: steps.target.outputs.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/scow-adapters/release/*

  deploy-to-pre-server:
    name: Deploy to Pre Server
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}
    needs:
      - scow-cli
      - build-images
      - build-adapters
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Install SSH dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      # 配置SSH密钥和主机
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRE_SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRE_SERVER_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts

      # 执行命令
      - name: Execute commands via SSH
        env:
          SSH_HOST: ${{ secrets.PRE_SERVER_SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no root@$SSH_HOST "/root/deploy.sh"

  release:
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}
    needs:
      - scow-cli
      - build-images
      - build-adapters

    if: github.ref_type == 'tag'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmmirror.com
          mirror: https://npmmirror.com/mirrors/node

      - uses: pnpm/action-setup@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: SCOW ${{ startsWith(github.ref_name, 'ai-') && format('AI Beta {0}', github.ref_name) || github.ref_name }}
          body_path: ${{ !startsWith(github.ref_name, 'ai-') && format('changelogs/{0}.md', github.ref_name) || null }}
          generate_release_notes: ${{ startsWith(github.ref_name, 'ai-') }}
          prerelease: ${{ startsWith(github.ref_name, 'ai-') }}

      - name: Send Notification Request
        run: |
          curl -X POST ${{ secrets.RELEASE_SERVICE_ADDRESS }}/version/success \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.RELEASE_API_KEY }}" \
          -d '{
            "repo": "private-scow"
          }'

  cleanup-pr:
    runs-on: pkuhpc-k8s-runners
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'

    steps:
      - name: Remove CLI from PR directory
        run: |
          target_url="https://ccrepo.pku.edu.cn/repository/scowbin/scow-cli/pr-${{ github.event.number }}"

          echo "Deleting CLI from target url: ${target_url}"

          for arch in x64 arm64; do
            curl -f -X DELETE --user "${{ secrets.CCREPO_USERNAME }}:${{ secrets.CCREPO_PASSWORD }}" "${target_url}/scow-cli-${arch}"
          done

          echo "✅ Successfully cleanup CLI"

      - name: Summary
        run: |
          echo "## 🧹 Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number**: ${{ github.event.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cleaned Directory**: pr-${{ github.event.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Merged PR cleanup completed" >> $GITHUB_STEP_SUMMARY

  cleanup-adapters-pr:
    runs-on: pkuhpc-k8s-runners
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'

    strategy:
      matrix:
        adapter:
          - scow-ai-adapter
          - scow-crane-adapter
          - scow-slurm-adapter
        arch:
          - amd64
          - arm64

    steps:
      - name: Remove adapter binary from PR directory
        run: |
          target_url="https://ccrepo.pku.edu.cn/repository/scowbin/${{ matrix.adapter }}/pr-${{ github.event.number }}/${{ matrix.arch }}/${{ matrix.adapter }}"

          echo "Deleting adapter binary from target url: ${target_url}"
          curl -f -X DELETE \
            --user "${{ secrets.CCREPO_USERNAME }}:${{ secrets.CCREPO_PASSWORD }}" \
            "$target_url" || echo "File not found or already deleted"

          echo "✅ Cleaned up ${{ matrix.adapter }} ${{ matrix.arch }} for PR ${{ github.event.number }}"
