name: Test, Build and Publish Projects

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]
  push:
    tags:
      - "v**"
      - "ai-beta.**"
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  INTERNAL_CR: ccimage.pku.edu.cn

jobs:
  test-version-packages:
    name: Test and version packages
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}

    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'pull_request')

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # changelog generation requires full history
          # to track each changelog file to its submission commit
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install packages
        run: |
          # Use PKU mirrors
          sudo sed -ri.bak -e 's/\/\/.*?(archive.ubuntu.com|mirrors.*?)\/ubuntu/\/\/mirrors.pku.edu.cn\/ubuntu/g' -e '/security.ubuntu.com\/ubuntu/d' /etc/apt/sources.list

          # Prepare sources for docker compose
          curl -fsSL https://mirrors.pku.edu.cn/docker-ce/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://mirrors.pku.edu.cn/docker-ce/linux/ubuntu \
            $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

          sudo apt update
          sudo apt install -y openssh-client docker-compose-plugin

          export HTTPS_PROXY=${{ vars.HTTPS_PROXY }}

      - uses: pnpm/action-setup@v4.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
          registry-url: https://registry.npmmirror.com

      - name: Install dependencies
        run: |
          pnpm config set registry https://registry.npmmirror.com
          pnpm i --frozen-lockfile

      - name: Prepare dev libs and code
        run: pnpm prepareDev

      - name: Lint code
        run: pnpm lint

      - name: Generate SSH key pairs for test
        if: vars.RUN_TESTS == 'true'
        run: ssh-keygen -t rsa -f "$HOME/.ssh/id_rsa" -N ""

      - name: Log in to the ${{ env.INTERNAL_CR }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.INTERNAL_CR }}
          username: ${{ secrets.CCIMAGE_USERNAME }}
          password: ${{ secrets.CCIMAGE_PASSWORD }}

      - name: Start dev env for db testing
        if: vars.RUN_TESTS == 'true'
        run: |
          SSH_AUTHORIZED_PUBLIC_KEY="$(cat $HOME/.ssh/id_rsa.pub)" pnpm devenv --build

      - name: Check running containers
        if: vars.RUN_TESTS == 'true'
        run: docker ps

      - name: Wait for ports
        if: vars.RUN_TESTS == 'true'
        uses: ifaxity/wait-on-action@v1.2.1
        with:
          log: true
          verbose: true
          resource: "tcp:localhost:22222 tcp:localhost:3306 tcp:localhost:6379 tcp:localhost:389 tcp:localhost:6000 tcp:localhost:6001 tcp:localhost:6002"

      - name: Run tests
        if: vars.RUN_TESTS == 'true'
        run: |
          # Unset proxy for tests
          export https_proxy=""
          export http_proxy=""
          export HTTPS_PROXY=""
          export HTTP_PROXY=""

          pnpm test:ci

      - name: Upload test converage
        uses: codecov/codecov-action@v4
        if: vars.RUN_TESTS == 'true'
        with:
          files: ./libs/auth/coverage/lcov.info,./libs/ssh/coverage/lcov.info,./libs/libconfig/coverage/lcov.info,./libs/decimal/coverage/lcov.info,./libs/server/coverage/lcov.info,./apps/cli/coverage/lcov.info,./apps/auth/coverage/lcov.info,./apps/mis-server/coverage/lcov.info,./apps/portal-server/coverage/lcov.info,./apps/gateway/coverage/lcov.info,./apps/audit-server/coverage/lcov.info

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        if: vars.RUN_RELEASE == 'true' && github.ref == 'refs/heads/master'
        with:
          version: pnpm ci:version
        env:
          GITHUB_TOKEN: ${{ github.token }}

  scow-cli:
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}

    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'pull_request')

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: pnpm

      - name: Install dependencies for scow-cli
        env:
          HTTPS_PROXY: ${{ vars.HTTPS_PROXY }}
        run: |
          pnpm config set registry https://registry.npmmirror.com
          pnpm i --frozen-lockfile --filter @scow/cli...

      - name: Build scow-cli
        run: pnpm build "--filter=@scow/cli"

      - name: Determine target directory
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            target="master"
            ref_type="branch"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            tag_name=${GITHUB_REF#refs/tags/}
            target="${tag_name}"
            ref_type="tag"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target="pr-${{ github.event.number }}"
            ref_type="pr"
          fi

          echo "target=${target}" >> $GITHUB_OUTPUT
          echo "ref_type=${ref_type}" >> $GITHUB_OUTPUT
          echo "Target directory: ${target}"

      - name: Upload CLI to file server
        run: |
          target_dir="/data/file/packages/PKUHPC/private-scow/${{ steps.target.outputs.target }}"

          echo "Uploading to target directory: ${target_dir}"
          mkdir -p ~/.ssh
          echo "${{ secrets.FILE_SERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa_file_server
          chmod 600 ~/.ssh/id_rsa_file_server
          ssh-keyscan "${{ vars.FILE_SERVER_HOST }}" >> ~/.ssh/known_hosts

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_file_server "${{ secrets.FILE_SERVER_USER }}"@"${{ vars.FILE_SERVER_HOST }}" "mkdir -p ${target_dir}"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_file_server apps/cli/exe/cli-x64 "${{ secrets.FILE_SERVER_USER }}"@"${{ vars.FILE_SERVER_HOST }}":${target_dir}/scow-cli-x64
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_file_server apps/cli/exe/cli-arm64 "${{ secrets.FILE_SERVER_USER }}"@"${{ vars.FILE_SERVER_HOST }}":${target_dir}/scow-cli-arm64

          echo "✅ File uploaded successfully!"
          echo "📁 AMD64 Available at: http://${{ vars.FILE_SERVER_HOST }}/file/packages/PKUHPC/private-scow/${{ steps.target.outputs.target }}/scow-cli-x64
          echo "📁 ARM64 Available at: http://${{ vars.FILE_SERVER_HOST }}/file/packages/PKUHPC/private-scow/${{ steps.target.outputs.target }}/scow-cli-arm64


  build-images:
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}

    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'pull_request')

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: scow
            file: scow
            build_args: ""

          - name: docs
            file: docs
            build_args: BASE_PATH=/SCOW/

    steps:
      - uses: actions/checkout@v4

      - name: Log in to the ${{ env.INTERNAL_CR }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.INTERNAL_CR }}
          username: ${{ secrets.CCIMAGE_USERNAME }}
          password: ${{ secrets.CCIMAGE_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: ${{ env.INTERNAL_CR }}/mirror/tonistiigi/binfmt:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.http_proxy=${{ vars.HTTPS_PROXY }}
            env.https_proxy=${{ vars.HTTPS_PROXY }}
            image=ccimage.pku.edu.cn/mirror/moby/buildkit:buildx-stable-1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.INTERNAL_CR }}/scow/${{ matrix.name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            HTTPS_PROXY=${{ vars.HTTPS_PROXY }}
            NO_PROXY=mirrors.pku.edu.cn
            ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          file: docker/Dockerfile.${{ matrix.file }}
          labels: ${{ steps.meta.outputs.labels }}
          # only build arm64 in tag commits or branches with name starting with `arm-`
          platforms: linux/amd64${{ (github.ref_type == 'tag' || startsWith(github.head_ref, 'arm-')) && ',linux/arm64' || '' }}


  deploy-to-pre-server:
    name: Deploy to Pre Server
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}
    needs:
      - scow-cli
      - build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Install SSH dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      # 配置SSH密钥和主机
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRE_SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRE_SERVER_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts

      # 执行命令
      - name: Execute commands via SSH
        env:
          SSH_HOST: ${{ secrets.PRE_SERVER_SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no root@$SSH_HOST "/root/deploy.sh"

  release:
    runs-on: ${{ vars.ACTION_RUNNER_LABEL }}
    needs:
      - scow-cli
      - build-images

    if: github.ref_type == 'tag'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
          registry-url: https://registry.npmmirror.com


      - name: Determine target directory
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            target="master"
            ref_type="branch"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            tag_name=${GITHUB_REF#refs/tags/}
            target="${tag_name}"
            ref_type="tag"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target="pr-${{ github.event.number }}"
            ref_type="pr"
          fi

          echo "target=${target}" >> $GITHUB_OUTPUT
          echo "ref_type=${ref_type}" >> $GITHUB_OUTPUT
          echo "Target directory: ${target}"

      - name: Download CLI from file server
        run: |
          target_dir="/data/file/packages/PKUHPC/private-scow/${{ steps.target.outputs.target }}"

          mkdir -p ~/.ssh
          echo "${{ secrets.FILE_SERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa_file_server
          chmod 600 ~/.ssh/id_rsa_file_server
          ssh-keyscan "${{ vars.FILE_SERVER_HOST }}" >> ~/.ssh/known_hosts

          echo "Downloading CLIs from file-server"

          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_file_server "${{ secrets.FILE_SERVER_USER }}"@"${{ vars.FILE_SERVER_HOST }}":${target_dir}/scow-cli-x64 release/scow-cli-x64
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_file_server "${{ secrets.FILE_SERVER_USER }}"@"${{ vars.FILE_SERVER_HOST }}":${target_dir}/scow-cli-arm64 release/scow-cli-arm64

          echo "File downloaded successfully from ${target_dir}"

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: release

      - name: Pack SCOW API
        id: pack-scow-api
        run: |
          cd protos
          output_file=$(pnpm pack)
          full_path=$(realpath $output_file)
          echo "Packed SCOW API to $full_path"
          echo "scow_api_file=$(realpath $full_path)" >> "$GITHUB_OUTPUT"


      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: SCOW ${{ startsWith(github.ref_name, 'ai-') && format('AI Beta {0}', github.ref_name) || github.ref_name }}
          body_path: ${{ !startsWith(github.ref_name, 'ai-') && format('changelogs/{0}.md', github.ref_name) || null }}
          generate_release_notes: ${{ startsWith(github.ref_name, 'ai-') }}
          prerelease: ${{ startsWith(github.ref_name, 'ai-') }}
          files: |
            release/scow-cli/cli-x64
            release/scow-cli/cli-arm64
            ${{ steps.pack-scow-api.outputs.scow_api_file }}


      - name: Send Notification Request
        run: |
          curl -X POST ${{ secrets.RELEASE_SERVICE_ADDRESS }}/version/success \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.RELEASE_API_KEY }}" \
          -d '{
            "repo": "private-scow"
          }'

  cleanup-pr:
    runs-on: pkuhpc-k8s-runners
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'

    steps:
      - name: Cleanup merged PR directory
        run: |
          target_dir="/data/file/packages/PKUHPC/private-scow/pr-${{ github.event.number }}"

          mkdir -p ~/.ssh
          echo "${{ secrets.FILE_SERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa_file_server
          chmod 600 ~/.ssh/id_rsa_file_server
          ssh-keyscan "${{ vars.FILE_SERVER_HOST }}" >> ~/.ssh/known_hosts

          echo "Cleaning up merged PR directory: ${target_dir}"

          # Check if directory exists before trying to remove it
          if ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_file_server "${{ secrets.FILE_SERVER_USER }}"@"${{ vars.FILE_SERVER_HOST }}" "test -d ${target_dir}"; then
            # Remove the PR directory when merged
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_file_server "${{ secrets.FILE_SERVER_USER }}"@"${{ vars.FILE_SERVER_HOST }}" "rm -rf ${target_dir}"
            echo "✅ Successfully cleaned up directory: ${target_dir}"
          else
            echo "ℹ️  Directory ${target_dir} does not exist, nothing to clean up"
          fi

      - name: Summary
        run: |
          echo "## 🧹 Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number**: ${{ github.event.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cleaned Directory**: pr-${{ github.event.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Merged PR cleanup completed" >> $GITHUB_STEP_SUMMARY
