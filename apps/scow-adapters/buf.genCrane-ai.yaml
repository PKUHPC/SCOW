version: v2
inputs:
  - git_repo: https://github.com/PKUHPC/CraneSched.git
    subdir: protos
    tag: ed8a623e0e1e981a7923dff9f9059e11327ee8fe
    exclude_paths:
      - Supervisor.proto
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: scow-adapters/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/crane-ai
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen/crane-ai
    opt: paths=source_relative,require_unimplemented_servers=false
