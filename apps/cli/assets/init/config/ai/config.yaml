# AI 系统数据库的信息。可以不修改
db:
  host: ai-db
  port: 3306
  user: root
  password: xxxxxxxx
  dbName: scow_ai
  debug: true
# AI 系统镜像保存 Harbor 仓库配置
harborConfig:
  # Harbor 仓库地址
  url: 10.0.0.xxx
  # Harbor 仓库中用于当前系统镜像管理的已存在的项目名称
  project: projectName
  # Harbor 仓库可登录用户的用户名
  # (建议使用上述项目的项目管理员以上权限人员，需具有 API 2.0 接口访问权限)
  user: user
  # Harbor 仓库可登录用户的登录密码
  password: password

jobMonitor:
  # grafana模版中的 dashboardId 和 dashboardName
  dashboardId: P17D2FB9C9DA87D76
  dashboardName: p17d2fb9c9da87d76
  # 作业监控中要展示的panelId, 每个字段对应一个面板 ID, 由grafana的规则决定
  panelIds:
    gpu: 4
    gpuMemory: 10
    cpu: 24
    memory: 26
    network: 46

# 必填
devHost:
  # vscode 相关配置，必填
  vscodeInfo:
    # vscode 二进制路径
    binPath: "/demo_path/vscode/bin/code-server"
  # 最大运行时间，可选，不填写表示不限制运行时间
  # maxRunningTimeHours: 10
