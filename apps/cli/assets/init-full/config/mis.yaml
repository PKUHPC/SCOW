#       default: "集群 {{ cluster }} 的作业ID {{ idJob }} 的计费"
#       en: "The billing for  jobId {{ idJob }} of Cluster {{ cluster }}"
#       zh_cn: "集群 {{ cluster }} 的作业ID {{ idJob }} 的计费"

bill:
# 生成月账单的定时任务，默认于每月的1、2号执行定时任务，2号再执行一次是为了防止1号环境有问题未完全生成
  monthlyCron: "0 1 1~2 * *"
# 生成年账单的定时任务
  yearlyCron: "0 1 1~2 1 *"
# 自定义生成之前某个账期的账单，例如 customTerms: ["2023","202407","202408"]，将会在系统启动时，生成"2023","202407","202408"三个周期的账单
  customTerms: []

# # 可选，默认不开启
# storage:
#   # 必填，bool 类型
#   enabled: true
#   # 必填，字符串数组，代表当前需要被管理的文件系统挂载点
#   # 当前 SCOW 仅支持一个挂载点
#   paths: ["/data"]

# # 同步scow与调度器(如slurm)账户用户信息的配置
# syncAccountUser:
#   # 单次同步最长处理时间，单位分钟
#   # 会作为周期性同步的默认最长处理时间, 系统启动后不可修改。
#   # 会作为手动同步的初始最长处理时间，仅支持在手动点击立刻同步时修改。
#   # 类型：整数型
#   # 默认 5 分钟，不配置则为 5 分钟
#   maxSyncDurationMinutes: 5
#   # 同步账户用户历史结果数据查询时间周期，单位天
#   # 类型：整数型
#   # 默认 7 天， 不配置则为 7 天
#   syncHistoryDayPeriod: 7

