#   # 计费方式id，请勿重复，重复的话后面的计费方式将会覆盖前面的，
#   # 定义后不能更改，自定义计费项会记录所使用的计费方式id，并存储到数据库里，
#   # 其作用与"max-cpusAlloc-mem", "max-gpu-cpusAlloc", "gpu", "cpusAlloc"等同，
