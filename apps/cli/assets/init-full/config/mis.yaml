# #自定义消费记录中的作业相关的存储内容
# jobChargeMetadata:
#   # 可选。需要保存的作业的字段，字段参考src/entities/JobInfo
#   savedFields: ["idJob", "cluster"]

#   # 可选。定义显示出来的格式。如果不配置，直接显示上面保存的字段的信息
