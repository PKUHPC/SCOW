# 是否启用作业管理功能
jobManagement: true

# 登录节点桌面功能
loginDesktop:
  # 是否启用桌面功能
  enabled: true

  # vnc 桌面
  wms:
    # 桌面名和对应的wm值。见文档
    - name: Xfce
      wm: xfce
      iconPath: desktop/1.png

  # 最多启动多少个桌面。
  maxDesktops: 3

  # 配置ShadowDesk远程控制工具，如果开启，有所参数必填。
  # shadowDesk:
    # 是否配置有ShadowDesk远程控制工具
    # enabled: false

    # 代理服务器的地址和端口
    # proxyServer: 10.129.227.58:8765

    # shadowDesk 桌面。
    # wms: ["xfce"]

    # api对接请求头参数
    # appId: ""

    # api入参加签的秘钥
    # appSecret: ""

# 是否启用交互式任务功能
apps: true

# 主页标题
homeTitle:
  # 默认文本
  # 此文本支持国际化
  defaultText: "Super Computing on Web"
  # 从不同域名访问，显示的不同的文本
  # hostnameMap:
  #   a.com: "a.com's SCOW Deployment"

# 主页文本
homeText:
  # 默认文本
  # 此文本支持国际化
  defaultText: "SCOW"
  # 从不同域名访问，显示的不同的文本
  # hostnameMap:
  #   a.com: "a.com's SCOW"

# 提交作业命令框中的提示语，可选配置
# 此文本支持国际化
# submitJobPromptText: "#此处参数设置的优先级高于页面其它地方，两者冲突时以此处为准"

# 是否启用终端功能
shell: true

# # 文件管理
# file:
#   # 文件预览功能
#   preview:
#     # 大小限制
#     # 可接受的格式为nginx的client_max_body_size可接受的值，默认为 50m
#     limitSize: "50m"
#   # 文件编辑功能
#   edit:
#     # 文件编辑大小限制
#     # 可接受的格式为nginx的client_max_body_size可接受的值，默认为 1m
#     limitSize: "1m"
#     # 不可编辑的文件后缀数组（可选）
#     # nonEditableFilenamePostfixes: [".exe", ".ppt"]
#   # 文件提交功能（可选）
#   submit:
#     # 可运行脚本后缀数组（可选）
#     executableFilenamePostfixes: [".sh"]

# 提交作业的默认工作目录。使用{{ name }}代替作业名称。相对于用户的家目录
# submitJobDefaultPwd: scow/jobs/{{ name }}

# 将保存的作业保存到什么位置。相对于用户家目录
# savedJobsDir: scow/savedJobs

# 将交互式任务的信息保存到什么位置。相对于用户的家目录
# appJobsDir: scow/appData

# TurboVNC的安装路径
# turboVNCPath: /opt/TurboVNC

