# 必填
db:
  host: db
  port: 3306
  user: root
  password: xxxxxxxxxx
  dbName: scow_notification

# 选填
redis:
  enabled: true
  host: redis
  port: 6379

# 必填
scow:
  misServerUrl: mis-server:5000

# 配置开启的通知方式
# 通知方式开启后可以进行配置用户接收与否
noticeType:
  # 站内消息
  siteMessage:
    enabled: true
  # 以下三项不填则为 false
  # 短信
  SMS:
    enabled: false
  # 邮件
  email:
    enabled: false
  # 公众号
  officialAccount:
    enabled: false

# 可选
messageBridge:
  address: http://message-bridage:3000

deleteExpiredMessages:
  cron: "0 3 * * *"

# 可选：Alertmanager Webhook 集成配置
# 配置后 notification 服务将暴露 HTTP 接口接收 Alertmanager 推送的告警，
# 并根据 receiverMappings 将告警消息发送给对应用户。
# alertmanager:
#   # 是否启用，默认为 true，设为 false 可临时关闭集成而保留配置
#   enabled: true
#   receiverMappings:
#       # alertname 标签值列表，用于匹配 Alertmanager 推送的告警（支持多个告警共享同一接收者配置）
#     - alertIds:
#         - HighCPUUsage
#         - HighMemoryUsage
#       # 直接指定接收用户的 ID 列表（可选）
#       users:
#         - user1
#         - user2
#       # 按 SCOW 角色接收，运行时自动查询对应用户（可选）
#       # 可选值：PLATFORM_ADMIN | PLATFORM_FINANCE | TENANT_ADMIN | TENANT_FINANCE | ACCOUNT_ADMIN | ACCOUNT_OWNER
#       roles:
#         - PLATFORM_ADMIN
#     - alertIds:
#         - DiskAlmostFull
#       roles:
#         - PLATFORM_ADMIN
#         - TENANT_ADMIN

