# 集群显示名称
# 此文本支持国际化
displayName: hpc01Name

# socwd是否启动，默认开启，目前不开启scowd系统不可用
# scowd:
#   enabled: true

# 跨集群传输功能
# crossClusterFileTransfer:
#   enabled: true
# #  传输节点的地址(ip地址:端口号)
#   transferNode: login01:8999

# 指定slurm配置
loginNodes:
  # 登录节点展示名称
  # 此文本支持国际化
  - name: login01
    # 登录节点的IP或者域名
    # 如果设置的是域名，请确认此节点的/etc/hosts中包含了域名到IP的解析信息
    address: login01
    scowd:
      port: 8999
  - name: login02
    address: login02
    scowd:
      port: 8999

# 适配器地址(ip地址:端口号)
adapterUrl: localhost:8972

# 门户系统代理网关节点配置
# proxyGateway:
#   # 带协议，不要以/结尾
#   url: http://10.2.3.2:1080

#   # 是否在这个机器上自动配置nginx
#   autoSetupNginx: true

# 集群在HPC中是否启用，默认为true
# 纯 AI 集群（如 k8s 集群）请显式配置为 false，避免管理系统对该集群调用 HPC 相关逻辑。
# 同一个超智算集群如同时承载 HPC 和 AI 业务，可同时配置 hpc.enabled 和 ai.enabled 为 true。
hpc:
  enabled: true
  # 选配：HPC 普通作业个性化配置
  # job:
  #   # 最长运行时间，可选，不填写表示不限制运行时间
  #   # 单位：小时。超过此时间则不能成功提交普通作业
  #   maxRunningTimeHours: 24
  # 选配：HPC 交互式应用个性化配置
  # app:
  #   # 最长运行时间，可选，不填写表示不限制运行时间
  #   # 单位：小时。超过此时间则不能成功提交交互式应用
  #   maxRunningTimeHours: 24

# 集群在AI中是否启用，默认为false
ai:
  enabled: false
  # 选配：AI 应用作业个性化配置
  # app:
  #   # 最长运行时间，可选，不填写表示不限制运行时间
  #   # 单位：小时。超过此时间则不能成功提交 AI 应用作业
  #   maxRunningTimeHours: 24
  # 选配：AI 训练作业个性化配置
  # train:
  #   # 最长运行时间，可选，不填写表示不限制运行时间
  #   # 单位：小时。超过此时间则不能成功提交 AI 训练作业
  #   maxRunningTimeHours: 24
  # 选配：AI 推理作业个性化配置
  # infer:
  #   # 最长运行时间，可选，不填写表示不限制运行时间
  #   # 单位：小时。超过此时间则不能成功提交 AI 推理作业
  #   maxRunningTimeHours: 24
  # 开发及相关配置，可选
  # devHost:
  #   # 是否开启，默认为 false，可选
  #   enabled: false
  #   # vscode 相关配置，必填
  #   vscodeInfo:
  #     # vscode 二进制路径
  #     binPath: "/demo_path/vscode/bin/code-server"
  #   # 最长运行时间，可选，不填写表示不限制运行时间
  #   # maxRunningTimeHours: 10
  # # 选配：分享数据资产的文件夹所在的目录
  # 计算共享目录顶层路径：
  #  1) 优先使用集群级 `sharedTopDir` 配置；
  #  2) 未配置时按用户家目录回退到“上上级目录”（如 `/nfs/home/user` -> `/nfs`）；
  #  3) 若上上级退化为根目录 `/`，则回退为上级目录，避免共享目录挂到根路径。
  # 共享目录的路径是在共享目录顶层路径里的.shared文件夹中（比如`${sharedTopDir}/.shared`,`/nfs/.shared`）
  # 配置后，不可修改
  # sharedTopDir: "/nfs"
  # 公共数据资产目录路径，若AI可用则必填。
  # 配置后需在集群中创建该目录（权限要求 root:root 755），可手动创建，
  # 或执行 ./cli create-configured-cluster-paths 辅助创建（需以 root 免密 SSH 到登录节点）。
  # 该路径配置之后请勿随意修改，否则已有的公共数据资产将无法正常使用。
  # clusterPublicPath: "/nfs/.public"
    # 选配：是否开启 AI 作业用户 ID 映射功能，默认关闭。

  # idmap 功能
  # 开启后，SCOW 在提交应用、训练、推理和开发机作业时，会通过 scowd 获取当前登录用户的用户映射信息
  # idmap:
  #   # 是否开启，默认关闭
  #   enabled: false
  #   # 可选值：notSet、plain、idmap、bindfs。未配置时默认为 notSet。
  #   mode: notSet

# # 可选，默认不开启
# storage:
#   # 必填，bool 类型
#   enabled: true
#   # 必填，字符串数组，代表当前需要被管理的文件系统挂载点
#   # 当前 SCOW 仅支持一个挂载点
#   paths: ["/data"]
#   # 可选，默认未开启副本备份
#   replicaExist: true

# 集群描述, 可选
# 此文本支持国际化
description: 集群描述

# 选配公共的挂载目录，优先级比ai/config.yaml中高
publicMountPoints:
  - /nfs/public

# 选配推理的配置，优先级比ai/config.yaml中高
inferConfig:
  # 选配，是否开启推理功能,默认开启
  # enabled: true
  # 推理服务代理地址，可选配置，不配置时用scow节点地址转发
  # proxyHost: www.example.com

# 选填作业监控配置：注意grafana的 11.3.0 版本不支持单个面板的数据持续刷新, 11.2.2 版本的可以
jobMonitor:
  # 必填grafana模版中的 dashboardId 和 dashboardName
  dashboardId: P17D2FB9C9DA87D76
  dashboardName: p17d2fb9c9da87d76
  # 选填作业监控中要展示的panelId,有默认值(值如下所示)，每个字段对应一个面板 ID, 由grafana的规则决定
  panelIds:
    gpu: 4
    gpuMemory: 10
    cpu: 24
    memory: 26
    network: 46
