# 集群显示名称
# 此文本支持国际化
displayName: hpc01Name

# 指定slurm配置
loginNodes:
  # 登录节点展示名称
  # 此文本支持国际化
  - name: login01
    # 登录节点的IP或者域名
    # 如果设置的是域名，请确认此节点的/etc/hosts中包含了域名到IP的解析信息
    address: login01
  - name: login02
    address: login02

# 适配器地址(ip地址:端口号)
adapterUrl: localhost:8972

# 门户系统代理网关节点配置
# proxyGateway:
#   # 带协议，不要以/结尾
#   url: http://10.2.3.2:1080

#   # 是否在这个机器上自动配置nginx
#   autoSetupNginx: true

# 集群在HPC或是否启用，默认为true
hpc:
  enabled: true

# 集群在AI或是否启用，默认为false
ai:
  enabled: false
  # 开发及相关配置，可选
  # devHost:
  #   # 是否开启，默认为 false，可选
  #   enabled: false
  #   # vscode 相关配置，必填
  #   vscodeInfo:
  #     # vscode 二进制路径
  #     binPath: "/demo_path/vscode/bin/code-server"
  #   # 最大运行时间，可选，不填写表示不限制运行时间
  #   # maxRunningTimeHours: 10

# # 可选，默认不开启
# storage:
#   # 必填，bool 类型
#   enabled: true
#   # 必填，字符串数组，代表当前需要被管理的文件系统挂载点
#   # 当前 SCOW 仅支持一个挂载点
#   paths: ["/data"]
#   # 可选，默认未开启副本备份
#   replicaExist: true

# 集群描述, 可选
# 此文本支持国际化
description: 集群描述
