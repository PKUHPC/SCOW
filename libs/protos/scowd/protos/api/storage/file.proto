syntax = "proto3";

package api.storage;

option go_package = "scowd/protos/gen/api/storage;apiv1";

enum FileType {
  FILE = 0;
  DIR = 1;
  // 软链接（符号链接）
  SYMLINK = 2;
}

message FileInfo {
  FileType file_type = 1;
  string name = 2;
  string mod_time = 3;
  uint64 size_byte = 4;
  uint32 mode = 5;
  // 当 type 为 SYMLINK 时，返回软链接解析后的目标路径（绝对路径）
  optional string link_target_path = 6;
  // 当 type 为 SYMLINK 时，返回软链接解析后的目标类型（FILE/ DIR）。
  // 若无法解析或目标不存在，则该字段为空。
  optional FileType link_target_type = 7;
}

message ReadDirectoryRequest {
  string user_id = 1;
  string dir_path = 2;
  optional bool no_check_permission = 3;
}

message ReadDirectoryResponse {
  repeated FileInfo files_info = 1;
}

message CreateFileRequest {
  string user_id = 1;
  string file_path = 2;
  optional bool no_check_permission = 3;
}

message CreateFileResponse {
}

message MakeDirectoryRequest {
  string user_id = 1;
  string dir_path = 2;
  optional bool no_check_permission = 3;
  // 需要指定目录特殊权限时使用
  // 创建多存储用户隔离目录时指定权限为 0700
  // 如不指定默认为 0755
  optional string mode = 4;
}

message MakeDirectoryResponse {
}

message DeleteDirectoryRequest {
  string user_id = 1;
  string dir_path = 2;
  optional bool no_check_permission = 3;
}

message DeleteDirectoryResponse {
}

message DeleteFileRequest {
  string user_id = 1;
  string file_path = 2;
  optional bool no_check_permission = 3;
}

message DeleteFileResponse {
}

message WriteFileRequest {
  string user_id = 1;
  string file_path = 2;
  string content = 3;
  // 表示是否为追加写入，默认为false，表示创建或覆盖
  optional bool append = 4;
}

message WriteFileResponse {
}

message ReadFileRequest {
  string user_id = 1;
  string file_path = 2;
}

message ReadFileResponse {
  bytes content = 1;
}

message ChangeModeRequest {
  string user_id = 1;
  string path = 2;
  string mode = 3;
  bool recursive  = 4;
  optional bool no_check_permission = 5;
}

message ChangeModeResponse {
}

message ChangeOwnerRequest {
  string user_id = 1; // 以谁的身份执行操作
  string path = 2; // 目标路径
  // 若指定，则只修改属主为此 uid 的文件；不传则修改路径下所有文件
  optional uint32 target_uid = 3;
  optional uint32 uid = 4;        // 新的 uid，不传则不改属主
  optional uint32 gid = 5;        // 新的 gid，不传则不改属组
  bool recursive = 6;
  optional bool no_check_permission = 7;
}

message ChangeOwnerResponse {
}

message GetFileMetadataRequest {
  string user_id = 1;
  string file_path = 2;
  optional bool no_check_permission = 3;
}

message GetFileMetadataResponse {
  uint64 size_byte = 1;
  FileType type = 2;
  // 文件的MIME类型，例如'text/plain'、'application/json'等
  string mime = 3;
  uint32 permission = 4;
  bool is_symlink = 5;
  // 当 is_symlink 为 true 时，返回软链接解析后的目标路径（绝对路径）
  optional string link_target_path = 6;
  // 当 is_symlink 为 true 时，返回软链接解析后的目标类型（FILE/ DIR / SYMLINK）。
  // 若无法解析或目标不存在，则该字段为空。
  optional FileType link_target_type = 7;
}

message GetHomeDirectoryRequest {
  string user_id = 1;
}

message GetHomeDirectoryResponse {
  string path = 1;
}

message MoveRequest {
  string user_id = 1;
  string from_path = 2;
  string to_path = 3;
  optional bool no_check_permission = 4;
}

message MoveResponse {
}

message ExistsRequest {
  string user_id = 1;
  string path = 2;
  optional bool no_check_permission = 3;
}

message ExistsResponse {
  bool exists = 1;
}

message CopyRequest {
  string user_id = 1;
  string from_path = 2;
  string to_path = 3;
  optional bool no_check_permission = 4;
  optional string mode = 5;
  optional bool chmod_recursive = 6;
}

message CopyResponse {
}

message ShareFileOrDirRequest {
  string user_id = 1;
  string source_file_path = 2;
  // 共享类别目录，例如：/nfs/.shared/{userId}/{target}
  string target_directory = 3;
  // 共享资源顶层目录，必须在 target_directory 下，例如：{targetDirectory}/{targetName}
  string target_top_dir = 4;
  // 共享资源版本目录，必须在 target_top_dir 下，例如：{targetTopDir}/{versionName}
  string target_full_dir = 5;
  // 最终复制目标路径，必须在 target_full_dir 下，且文件名应与 source_file_path 的文件名一致
  string shared_file_path = 6;
  string mode = 7;
}

message ShareFileOrDirResponse {
}

message InitMultipartUploadRequest {
  string user_id = 1;
  string path = 2;
  string name = 3;
  optional bool no_check_permission = 4;
  uint64 file_size_byte = 5;
  uint64 modification_time = 6;
}

message InitMultipartUploadResponse {
  uint64 chunk_size_byte = 1;
  uint64 file_size_byte = 2;
  uint64 modification_time = 3;
  repeated uint64 uploaded_indices = 4;
}

message UploadRequest {

  message Info {
    string user_id = 1;
    string path = 2;
    optional bool no_check_permission = 3;
    // 不传 chunk_idx 表示并非分片上传的请求，是普通的文件上传
    optional uint64 chunk_idx = 4;
  }

  oneof message {
    Info info = 1;
    bytes chunk = 2;
  };
}

message UploadResponse {
  uint64 written_bytes = 1;
}

message CompleteMultipartUploadRequest {
  string user_id = 1;
  string path = 2;
  string name = 3;
  optional bool no_check_permission = 4;
}

message CompleteMultipartUploadResponse {
}

message DownloadRequest {
  string user_id = 1;
  string path = 2;
  uint32 chunk_size_byte = 3;
  optional uint64 offset_bytes = 4;
  optional uint32 limit_bytes = 5;
  optional bool no_check_permission = 6;
}

message DownloadResponse {
  bytes chunk = 1;
}

message CompressAndDownloadRequest {
  string user_id = 1;
  repeated string paths = 2; // 需要压缩的文件或目录路径
  uint32 chunk_size_byte = 3;
}

message CompressAndDownloadResponse {
  bytes chunk = 1;
}

message CompressFilesRequest {
  string user_id = 1;
  // 需压缩的文件路径
  repeated string paths = 2;
  // 目标压缩文件路径
  string archive_path = 3;
  optional bool no_check_permission = 4;
}

message CompressFilesResponse {}

message DecompressFileRequest {
  string user_id = 1;
  // 需要解压缩的文件路径
  string file_path = 2;
  // 目标解压缩文件路径
  string decompression_path = 3;
  optional bool no_check_permission = 4;
}

message DecompressFileResponse {}

service FileService {
  rpc Copy(CopyRequest) returns (CopyResponse) {}
  rpc ShareFileOrDir(ShareFileOrDirRequest) returns (ShareFileOrDirResponse) {}
  rpc Move(MoveRequest) returns (MoveResponse) {}
  rpc Exists(ExistsRequest) returns (ExistsResponse) {}

  rpc ReadDirectory(ReadDirectoryRequest) returns (ReadDirectoryResponse) {}
  rpc MakeDirectory(MakeDirectoryRequest) returns (MakeDirectoryResponse) {}
  rpc DeleteDirectory(DeleteDirectoryRequest) returns (DeleteDirectoryResponse) {}

  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse) {}
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse) {}
  // 写入文件大小限制为 10 MB，上传更大文件考虑使用分片上传相关接口
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse) {};
  // 读取文件大小限制为 10 MB，读取更大文件考虑使用 Download 接口
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse) {};

  rpc ChangeMode(ChangeModeRequest) returns (ChangeModeResponse) {};
  rpc ChangeOwner(ChangeOwnerRequest) returns (ChangeOwnerResponse) {};

  rpc Download(DownloadRequest) returns (stream DownloadResponse);
  // 下载并压缩，将压缩数据以流的方式返回
  rpc CompressAndDownload (CompressAndDownloadRequest) returns (stream CompressAndDownloadResponse);
  rpc InitMultipartUpload(InitMultipartUploadRequest) returns (InitMultipartUploadResponse);
  rpc Upload(stream UploadRequest) returns (UploadResponse);
  rpc CompleteMultipartUpload(CompleteMultipartUploadRequest) returns (CompleteMultipartUploadResponse);

  rpc CompressFiles(CompressFilesRequest) returns (CompressFilesResponse);

  rpc DecompressFile(DecompressFileRequest) returns (DecompressFileResponse);

  rpc GetFileMetadata(GetFileMetadataRequest) returns (GetFileMetadataResponse);
  rpc GetHomeDirectory(GetHomeDirectoryRequest) returns (GetHomeDirectoryResponse);
}
