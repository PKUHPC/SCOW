syntax = "proto3";

package notification;

import "common.proto";
import "message_type.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message Message {
  uint64 id = 1;
  MessageType message_type = 2;
  google.protobuf.Struct metadata = 3;
  repeated string descriptions = 4;
  optional bool is_read = 5;
  string created_at = 6;
  string updated_at = 7;
  optional google.protobuf.Timestamp expired_at = 8;
  repeated NoticeType notice_types = 9;
}

message SystemSendMessageRequest {
  string system_id = 1;
  optional TargetType target_type = 2;
  repeated string target_ids = 3;
  string message_type = 4;
  google.protobuf.Struct metadata = 5;
  repeated string description_data = 6;
  optional MessageType message_type_template = 7;
}

message SystemSendMessageResponse {
}

message AdminSendMessageRequest {
  optional TargetType target_type = 1;
  repeated string target_ids = 2;
  string message_type = 3;
  string title = 4;
  string content = 5;
  repeated NoticeType notice_types = 6;
  optional google.protobuf.Timestamp expired_at = 7;
}

message AdminSendMessageResponse {
}

message ListMessagesRequest {
  optional string user_id = 1;
  // Deprecated: use message_types instead. Kept for backward compatibility.
  optional string message_type = 2;
  optional string category = 3;
  optional NoticeType notice_type = 4;
  optional ReadStatus read_status = 5;
  optional uint32 page = 6;
  optional uint32 page_size = 7;
  // Filter by multiple message types. Takes precedence over message_type when non-empty.
  repeated string message_types = 8;
}

message ListMessagesResponse {
  optional uint64 total_count = 1;
  repeated Message messages = 2;
}

message MarkMessageReadRequest {
  string user_id = 1;
  uint64 message_id = 2;
}

message MarkMessageReadResponse {
}

message MarkAllMessagesReadRequest {
  string user_id = 1;
}

message MarkAllMessagesReadResponse {

}

message DeleteMessagesRequest {
  string user_id = 1;
  repeated uint64 message_ids = 2;
}

message DeleteMessagesResponse {

}

message DeleteAllReadMessagesRequest {
  string user_id = 1;
}

message DeleteAllReadMessagesResponse {

}

message GetMessageExpirationTimeRequest {
  optional string message_type = 1;
}
message GetMessageExpirationTimeResponse {
  optional uint64 expired_after_seconds = 1;
}

message ChangeMessageExpirationTimeRequest {
  optional string message_type = 1;
  optional uint64 expired_after_seconds = 2;
}

message ChangeMessageExpirationTimeResponse {
}

message AdminListMessagesRequest {
  repeated string message_types = 1;
  repeated string categories = 2;
  optional uint32 page = 3;
  optional uint32 page_size = 4;
  // 搜索关键词, 搜索消息标题和内容中包含关键词的消息
  optional string keyword = 5;
}

message AdminListMessagesResponse {
  optional uint64 total_count = 1;
  repeated Message messages = 2;
}

// Single alert item from Alertmanager webhook v4 payload.
message AlertmanagerAlert {
  // "firing" or "resolved"
  string status = 1;
  // Key-value pairs identifying the alert, e.g. alertname, instance, severity, cluster.
  // Used to match receiverMappings via the "alertname" label.
  map<string, string> labels = 2;
  // Human-readable metadata attached to the alert rule, e.g.:
  //   summary / summary_zh   — short title (English / Chinese)
  //   description / description_zh — detailed message body
  //   {starts_at} and {ends_at} placeholders in description/description_zh are replaced at runtime.
  map<string, string> annotations = 3;
  // Time when the alert started firing.
  google.protobuf.Timestamp starts_at = 4;
  // Time when the alert was resolved. Zero value ("0001-01-01T00:00:00Z") means still firing.
  google.protobuf.Timestamp ends_at = 5;
}

// Alertmanager webhook v4 request payload.
message ReceiveMonitorAlertRequest {
  // Webhook payload version, currently always "4".
  string version = 1;
  // Opaque key identifying the alert group (based on group_by labels in Alertmanager routing).
  // Multiple alerts with the same group_by label values share the same group_key.
  string group_key = 2;
  // "firing" if at least one alert is firing, "resolved" if all alerts resolved
  string status = 3;
  // Snapshot of all alerts in this group at the time of the notification.
  // May contain multiple alerts when Alertmanager groups them by shared labels.
  repeated AlertmanagerAlert alerts = 4;
}

message ReceiveMonitorAlertResponse {}

service MessageService {
  rpc AdminSendMessage(AdminSendMessageRequest) returns (AdminSendMessageResponse);
  rpc AdminListMessages(AdminListMessagesRequest) returns (AdminListMessagesResponse);

  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  rpc MarkMessageRead(MarkMessageReadRequest) returns (MarkMessageReadResponse);
  rpc MarkAllMessagesRead(MarkAllMessagesReadRequest) returns (MarkAllMessagesReadResponse);

  rpc DeleteMessages(DeleteMessagesRequest) returns (DeleteMessagesResponse);
  rpc DeleteAllReadMessages(DeleteAllReadMessagesRequest) returns (DeleteAllReadMessagesResponse);

  rpc GetMessageExpirationTime(GetMessageExpirationTimeRequest) returns (GetMessageExpirationTimeResponse);
  rpc ChangeMessageExpirationTime(ChangeMessageExpirationTimeRequest) returns (ChangeMessageExpirationTimeResponse);

  // Receives monitor alerts from Alertmanager and dispatches them to configured recipients.
  // Alertmanager webhook url: /api/notification.MessageService/ReceiveMonitorAlert
  rpc ReceiveMonitorAlert(ReceiveMonitorAlertRequest) returns (ReceiveMonitorAlertResponse);
}
