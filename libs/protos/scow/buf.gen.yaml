version: v2
plugins:
  - local: ["./node_modules/ts-proto/protoc-gen-ts_proto"]
    strategy: all
    out: generated
    opt:
      - unrecognizedEnum=false
      - useDate=string
      - useExactTypes=false
      - oneof=unions
      - esModuleInterop=true
      - useOptionals=messages
      - outputServices=grpc-js
      - outputTypeAnnotations=static-only

