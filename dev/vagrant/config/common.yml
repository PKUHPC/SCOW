# 创建用户、修改密码时，密码的规则。必须设置
passwordPattern:
  # 正则表达式。下面为默认值
  regex: ^(?=.*\d)(?=.*[a-zA-Z])(?=.*[`~!@#\$%^&*()_+\-[\];',./{}|:"<>?]).{8,}$

  # 出错时的消息。下面为默认值
  errorMessage: 必须包含字母、数字和符号，长度大于等于8位
  # errorMessage:
  #   i18n:
  #     default: 必须包含字母、数字和符号，长度大于等于8位,
  #     en: PASSWORD PATTERN TEST,
  #     zh_cn: 必须包含字母、数字和符号，长度大于等于8位


# # 在导航栏右侧用户下拉菜单中增加链接相关配置
