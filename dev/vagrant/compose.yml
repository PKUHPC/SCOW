version: "3"

services:
  ldapadmin:
    image: osixia/phpldapadmin
    ports:
      - 3890:80
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap://192.168.88.101
      PHPLDAPADMIN_HTTPS: false

  novnc-client:
    image: ghcr.io/pkuhpc/novnc-client-docker:master
    ports:
      - 6080:80

networks:
  default:
    name: scow-vagrant-devenv
