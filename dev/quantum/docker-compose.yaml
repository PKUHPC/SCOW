version: "3.8"

services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18382:18382"
    environment:
      # - QOBODY_BASE_URL=http://localhost:3000/api/tc/a_userone/ #使用本地要测试的账户的账户名
      - QOBODY_BASE_URL=http://localhost:5007/api/tc/a_userone/


  qobody:
    image: ccrepo.pku.edu.cn/scow/qobody
    ports:
      - "8088:8088"
    env_file:
      - ./.env.local
    environment:
      - QOST_CHIPS=t40=tianxuan_s2&t12=tianji_s2&t60=tianji_m1&t57=tianji_m2&t57v15s1=tianji_m2v16s1&t57v14s2=tianji_m2v14s2&t57v15s3=tianji_m2v15s3&t57v13s4=tianji_m2v14s4&t12v5=tianji_s2v6&t12v7=tianji_s2v7
